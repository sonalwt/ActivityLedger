# nginx_redirect_fix.conf
# If you have access to your nginx configuration, check for these common issues:

# 1. HTTPS redirect that causes 308:
server {
    listen 80;
    server_name api-timesheet.firsteconomy.com;
    
    # This might be causing 308 redirects:
    # return 308 https://$server_name$request_uri;
    
    # Change to:
    # return 301 https://$server_name$request_uri;
    # Or better, proxy to your backend directly
}

# 2. Trailing slash redirect:
location /api/sync {
    # This might cause issues:
    # try_files $uri $uri/ =404;
    
    # Better approach:
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}

# 3. For the stateless webhook endpoint:
location /api/v1/ {
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
