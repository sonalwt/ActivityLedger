name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 617103915273.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: activityledger/backend
  ECS_CLUSTER: activityledger-prod
  ECS_SERVICE: activityledger-backend-service

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::617103915273:role/activityledger-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build React frontend ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build React frontend
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_URL: /
          REACT_APP_API_URL: 'https://api-timesheet.firsteconomy.com'
          CI: false

      - name: Copy frontend build into backend
        run: cp -r frontend/build backend/frontend_build

      # ── Build and push Docker image ───────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -f backend/Dockerfile \
            backend/

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      # ── Deploy to ECS ─────────────────────────────────────────────────────
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --region $AWS_REGION \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --query "service.deployments[0].{id:id,rolloutState:rolloutState}"

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --region $AWS_REGION \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE
          echo "Deployment complete"
