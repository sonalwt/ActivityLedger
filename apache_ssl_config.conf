# /etc/apache2/sites-available/api-timesheet.firsteconomy.com-ssl.conf
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api-timesheet.firsteconomy.com
    
    # Enable SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api-timesheet.firsteconomy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api-timesheet.firsteconomy.com/privkey.pem
    
    # Proxy all requests to FastAPI backend running on port 8090
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    
    # SSL Proxy settings
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    
    # Prevent redirect loops
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    
    # Handle preflight OPTIONS requests
    <Location /api>
        DirectorySlash Off
    </Location>
    
    <Location />
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Order allow,deny
        Allow from all
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/timesheet-backend-ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/timesheet-backend-ssl_access.log combined
    
    # Optional: Add compression
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </IfModule>
</VirtualHost>
</IfModule>

# Keep the HTTP VirtualHost to redirect to HTTPS
<VirtualHost *:80>
    ServerName api-timesheet.firsteconomy.com
    
    # Redirect HTTP to HTTPS (use 301 instead of 308)
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =api-timesheet.firsteconomy.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=301,L]
</VirtualHost>
