# Updated Apache configuration for api-timesheet.firsteconomy.com
# This allows both HTTP and HTTPS without redirects

# HTTP Configuration (Port 80)
<VirtualHost *:80>
    ServerName api-timesheet.firsteconomy.com
    
    # Proxy all requests to FastAPI backend running on port 8090
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    
    # Handle preflight OPTIONS requests
    <Location /api>
        DirectorySlash Off
    </Location>
    
    <Location />
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Order allow,deny
        Allow from all
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/timesheet-backend_error.log
    CustomLog ${APACHE_LOG_DIR}/timesheet-backend_access.log combined
    
    # Optional: Add compression
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </IfModule>
    
    # REMOVED: The redirect rules that were causing 308 redirect
</VirtualHost>

# HTTPS Configuration (Port 443) - if you have SSL configured
<VirtualHost *:443>
    ServerName api-timesheet.firsteconomy.com
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key
    SSLCertificateChainFile /path/to/your/chain.crt
    
    # Proxy all requests to FastAPI backend running on port 8090
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    
    # Handle preflight OPTIONS requests
    <Location /api>
        DirectorySlash Off
    </Location>
    
    <Location />
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Order allow,deny
        Allow from all
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/timesheet-backend-ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/timesheet-backend-ssl_access.log combined
    
    # Optional: Add compression
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </IfModule>
</VirtualHost>
