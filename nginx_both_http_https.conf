# Quick nginx config to allow BOTH HTTP and HTTPS without redirects
# /etc/nginx/sites-available/api-timesheet.firsteconomy.com

# HTTP server - serve directly, no redirect
server {
    listen 80;
    server_name api-timesheet.firsteconomy.com;
    
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api-timesheet.firsteconomy.com;
    
    ssl_certificate /etc/letsencrypt/live/api-timesheet.firsteconomy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-timesheet.firsteconomy.com/privkey.pem;
    
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
