# /etc/nginx/sites-available/api-timesheet.firsteconomy.com
# Proper HTTPS configuration without 308 redirects

# HTTP server - redirect to HTTPS (use 301 instead of 308)
server {
    listen 80;
    server_name api-timesheet.firsteconomy.com;
    
    # Use 301 instead of 308 for better compatibility
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api-timesheet.firsteconomy.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api-timesheet.firsteconomy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-timesheet.firsteconomy.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    
    # Logging
    access_log /var/log/nginx/api-timesheet.access.log;
    error_log /var/log/nginx/api-timesheet.error.log;

    # Proxy to your FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:8000;  # Your FastAPI app
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Important: Don't add trailing slashes
        proxy_redirect off;
    }
    
    # Specific handling for /api/sync endpoint
    location = /api/sync {
        proxy_pass http://127.0.0.1:8000/api/sync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prevent any redirects
        proxy_redirect off;
    }
    
    # Handle /api/v1 endpoints
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
