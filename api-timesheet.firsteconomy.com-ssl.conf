<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api-timesheet.firsteconomy.com
    
    # SSL Configuration
    SSLEngine on
    
    # SSL Certificate Files (adjust paths if needed)
    # If using Let's Encrypt:
    SSLCertificateFile /etc/letsencrypt/live/api-timesheet.firsteconomy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api-timesheet.firsteconomy.com/privkey.pem
    
    # If using other certificates, use these paths:
    # SSLCertificateFile /path/to/your/certificate.crt
    # SSLCertificateKeyFile /path/to/your/private.key
    # SSLCertificateChainFile /path/to/your/chain.pem
    
    # Modern SSL Protocol Support
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # Proxy Configuration to FastAPI Backend
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Important: Tell backend it's HTTPS
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Scheme "https"
    
    # Proxy all requests to FastAPI backend on port 8090
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    
    # WebSocket support (if needed)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8090/$1" [P,L]
    
    # Timeouts
    ProxyTimeout 300
    ProxyBadHeader Ignore
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/api-timesheet-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/api-timesheet-ssl-access.log combined
    
    # Directory Options
    <Directory />
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # API-specific settings
    <Location /api>
        # Disable directory slash redirect
        DirectorySlash Off
    </Location>
    
    # Handle large requests (for ActivityWatch data)
    LimitRequestBody 10485760
    
    # Enable compression
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </IfModule>
</VirtualHost>
</IfModule>